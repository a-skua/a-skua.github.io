services:
  init-node-modules:
    image: node:24
    volumes:
      - node-modules:/home/node/app/node_modules
    entrypoint: chown node:node /home/node/app/node_modules

  node:
    image: node:24
    user: node
    working_dir: /home/node/app
    volumes:
      - .:/home/node/app
      - node-modules:/home/node/app/node_modules
    ports:
      - "${PORT:-3000}:3000"
    command: sh -c "npm ci --ignore-scripts && npm run serve -- --port 3000"
    depends_on:
      init-node-modules:
        condition: service_completed_successfully

volumes:
  node-modules:
